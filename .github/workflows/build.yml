name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VCPKG_COMMIT: fc3f61366102c1f0d4547c06d03c523bb18c13a7
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item build/SexLabSceneFreeLook.dll package/SKSE/Plugins/
          Copy-Item build/SexLabSceneFreeLook.pdb package/SKSE/Plugins/ -ErrorAction SilentlyContinue
          Copy-Item README.md package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SexLabSceneFreeLook
          path: package/
          if-no-files-found: error

      - name: Push built files to the build-output branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Path package/* -Destination $out
          Set-Location $out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.ref_name }} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:build-output-${{ github.ref_name }}"
