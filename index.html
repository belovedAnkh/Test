<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑士的圣杯</title>
<style>
  body { margin: 0; background: #1b1410; color: #e8d9b5; font-family: serif;
         display: flex; flex-direction: column; align-items: center; padding: 12px; }
  h1 { margin: 4px 0; font-size: 22px; letter-spacing: 2px; }
  canvas { background: #2d4a2b; border: 4px solid #8a6b3a; max-width: 100%; touch-action: none; }
  p { margin: 6px 0; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<h1>⚔ 骑士的圣杯 ⚔</h1>
<p>方向键 / WASD 移动，收集圣杯 🏆，躲开哥布林 👹。按空格键开始或重新开始。</p>
<canvas id="c" width="480" height="480"></canvas>
<p id="info"></p>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const T = 24, N = 20; // 格子大小、地图边长
let state, keys = {}, best = 0;

function rnd() { return Math.floor(Math.random() * N); }

function reset() {
  state = { x: 10, y: 10, score: 0, lives: 3, cup: null, goblins: [], tick: 0, over: false, started: true };
  placeCup();
  for (let i = 0; i < 3; i++) addGoblin();
}
function placeCup() { state.cup = { x: rnd(), y: rnd() }; }
function addGoblin() {
  let x, y;
  do { x = rnd(); y = rnd(); } while (Math.abs(x - state.x) + Math.abs(y - state.y) < 6);
  state.goblins.push({ x, y });
}

function move(dx, dy) {
  if (!state || state.over) return;
  state.x = Math.max(0, Math.min(N - 1, state.x + dx));
  state.y = Math.max(0, Math.min(N - 1, state.y + dy));
  check();
}

function check() {
  if (state.x === state.cup.x && state.y === state.cup.y) {
    state.score++;
    best = Math.max(best, state.score);
    placeCup();
    if (state.score % 3 === 0) addGoblin();
  }
  for (const gb of state.goblins) {
    if (gb.x === state.x && gb.y === state.y) {
      state.lives--;
      gb.x = rnd(); gb.y = rnd();
      if (state.lives <= 0) state.over = true;
    }
  }
}

function step() {
  if (!state || !state.started || state.over) return;
  state.tick++;
  if (state.tick % 3 === 0) { // 哥布林每 3 帧追一步
    for (const gb of state.goblins) {
      if (Math.random() < 0.7) {
        const dx = state.x - gb.x, dy = state.y - gb.y;
        if (Math.abs(dx) > Math.abs(dy)) gb.x += Math.sign(dx); else gb.y += Math.sign(dy);
      } else {
        gb.x = Math.max(0, Math.min(N - 1, gb.x + [-1, 0, 1][rnd() % 3]));
        gb.y = Math.max(0, Math.min(N - 1, gb.y + [-1, 0, 1][rnd() % 3]));
      }
    }
    check();
  }
}

function draw() {
  g.clearRect(0, 0, cv.width, cv.height);
  g.font = (T - 4) + 'px serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const put = (e, p) => g.fillText(e, p.x * T + T / 2, p.y * T + T / 2 + 1);
  if (state && state.started) {
    put('🏆', state.cup);
    state.goblins.forEach(gb => put('👹', gb));
    put('🛡️', state);
  }
  g.fillStyle = 'rgba(0,0,0,.65)';
  if (!state || !state.started || state.over) {
    g.fillRect(0, 170, cv.width, 140);
    g.fillStyle = '#f3e3b0'; g.font = '28px serif';
    g.fillText(state && state.over ? '骑士倒下了……' : '骑士的圣杯', cv.width / 2, 215);
    g.font = '18px serif';
    g.fillText(state && state.over ? '得分 ' + state.score + '　按空格再战' : '按空格开始冒险', cv.width / 2, 260);
  }
  document.getElementById('info').textContent = state && state.started
    ? '圣杯 ' + state.score + '　生命 ' + '❤'.repeat(Math.max(state.lives, 0)) + '　最高 ' + best
    : '';
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (!state || state.over) reset(); return; }
  const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1],
              arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
  if (m) { e.preventDefault(); move(m[0], m[1]); }
});

// 触屏：点击画布，按相对骑士的方向移动
cv.addEventListener('pointerdown', e => {
  if (!state || state.over) { reset(); return; }
  const r = cv.getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width * N - state.x - 0.5;
  const dy = (e.clientY - r.top) / r.height * N - state.y - 0.5;
  if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0); else move(0, Math.sign(dy));
});

setInterval(step, 150);
(function loop() { draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
